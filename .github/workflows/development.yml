name: 🧪 Development Distribution
run-name: "🧪 Dev: ${{ inputs.commit_msg || github.event.head_commit.message || 'Manual Run' }} [#${{ github.run_number }}] (${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      commit_msg:
        description: 'Commit message / description (Optional)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  distribute-dev:
    name: Build & Distribute (Development)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # إنشاء ملف .env بدون GEMINI_API_KEY (تم نقله لـ Supabase Edge Functions)
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          AUTH_CALLBACK_URL=${{ secrets.AUTH_CALLBACK_URL }}
          PAYMOB_PUBLIC_KEY=${{ secrets.PAYMOB_PUBLIC_KEY }}
          PAYMOB_CARD_INTEGRATION_ID=${{ secrets.PAYMOB_CARD_INTEGRATION_ID }}
          PAYMOB_WALLET_INTEGRATION_ID=${{ secrets.PAYMOB_WALLET_INTEGRATION_ID }}
          EOF

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # إنشاء ملف key.properties وملف الـ Keystore للتوقيع
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/k_rehab_release.jks
          EOF

      - name: Decode & create keystore file
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/k_rehab_release.jks

      - name: Get dependencies
        run: flutter pub get

      # يبقى APK للـ Dev (أسهل للمختبرين - لا يحتاج Play Store)
      - name: Build APK (development)
        run: |
          flutter build apk \
            --release \
            --flavor development \
            --target lib/main_development.dart \
            --build-number=${{ github.run_number }} \
            --obfuscate \
            --split-debug-info=./debug_info

      - name: Get commit message
        run: echo "COMMIT_MSG=$(git log -1 --pretty=%s)" >> $GITHUB_ENV

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.DEV_FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: internal-testers
          file: build/app/outputs/flutter-apk/app-development-release.apk
          releaseNotes: |
            🧪 Development Build
            Branch: ${{ github.ref_name }}
            Commit: ${{ env.COMMIT_MSG }}
            By: ${{ github.actor }}
            Build: #${{ github.run_number }}

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-dev-${{ github.run_number }}
          path: debug_info/
          retention-days: 30
