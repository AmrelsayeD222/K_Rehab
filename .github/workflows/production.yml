name: 🚀 Production Distribution
run-name: "🚀 Prod: ${{ inputs.commit_msg || github.event.head_commit.message || 'Manual Run' }} [#${{ github.run_number }}] (${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      commit_msg:
        description: 'Commit message / description (Optional)'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  distribute-prod:
    name: Build & Distribute (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          AUTH_CALLBACK_URL=${{ secrets.AUTH_CALLBACK_URL }}
          EOF

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (production)
        run: flutter build apk --release --flavor production -t lib/main_production.dart --build-number=${{ github.run_number }}

      
      - name: Get commit message
        run: echo "COMMIT_MSG=$(git log -1 --pretty=%s)" >> $GITHUB_ENV

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.PROD_FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: qa-testers
          file: build/app/outputs/flutter-apk/app-production-release.apk
          releaseNotes: |
            🚀 Production Build
            Branch: ${{ github.ref_name }}
            Commit: ${{ env.COMMIT_MSG }}
            By: ${{ github.actor }}
            Build: #${{ github.run_number }}
